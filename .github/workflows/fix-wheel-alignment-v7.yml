name: Fix wheel alignment v7

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Apply wheel alignment override v7') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply deterministic wheel alignment override
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n/\* FINAL_WHEEL_ALIGNMENT_V7_START \*/.*?/\* FINAL_WHEEL_ALIGNMENT_V7_END \*/\n','\n',s,flags=re.S)
          override=r'''
/* FINAL_WHEEL_ALIGNMENT_V7_START */
function finalWheelReference(){
  if(!model)return null;
  const root=new T.Box3().setFromObject(model);
  const size=root.getSize(new T.Vector3());
  const center=root.getCenter(new T.Vector3());
  const H=size.y||1;
  const W=Math.max(size.x,size.z)||1;
  const candidates=[];
  model.traverse(o=>{
    if(!o.isMesh)return;
    const n=((o.name||'')+' '+(o.material?.name||'')).toLowerCase();
    if(/arm\s*rest|armrest|back\s*rest\s*base|backrest\s*base/.test(n))return;
    const b=new T.Box3().setFromObject(o);
    if(b.isEmpty())return;
    const c=b.getCenter(new T.Vector3());
    const q=b.getSize(new T.Vector3());
    if(/wheel|caster|castor|roller|star.?base|wheel.?base|wheelbase/.test(n)){
      candidates.push({b,c,q,explicit:true,o});
      return;
    }
    if(c.y<=root.min.y+H*.34 && Math.max(q.x,q.z)>=W*.08)candidates.push({b,c,q,explicit:false,o});
  });
  let refBox=null;
  const explicit=candidates.filter(x=>x.explicit);
  if(explicit.length){refBox=new T.Box3();explicit.forEach(x=>refBox.union(x.b));}
  else{
    const target=W*.88;
    refBox=new T.Box3(new T.Vector3(center.x-target/2,root.min.y,center.z-target/2),new T.Vector3(center.x+target/2,root.min.y+H*.18,center.z+target/2));
  }
  const refCenter=refBox.getCenter(new T.Vector3());
  const refSize=refBox.getSize(new T.Vector3());
  const footprint=Math.max(refSize.x,refSize.z,W*.88);
  return {root,center,refBox,refCenter,footprint};
}
function showWheel(slot){
  if(!model||!wheelGLB[slot])return;
  if(wheelGroup)scene.remove(wheelGroup);
  const ref=finalWheelReference();
  if(!ref){$('wheelStatus').textContent='Primary chair is not loaded.';return;}
  const w=cloneWheel(wheelGLB[slot]);
  w.updateMatrixWorld(true);
  let b=new T.Box3().setFromObject(w);
  const s=b.getSize(new T.Vector3());
  const sourceFootprint=Math.max(s.x,s.z)||1;
  const scale=ref.footprint/sourceFootprint;
  w.scale.multiplyScalar(scale);
  w.updateMatrixWorld(true);
  b.setFromObject(w);
  const c=b.getCenter(new T.Vector3());
  w.position.x+=ref.center.x-c.x;
  w.position.z+=ref.center.z-c.z;
  b.setFromObject(w);
  w.position.y+=ref.root.min.y-b.min.y;
  w.updateMatrixWorld(true);
  wheelGroup=new T.Group();
  wheelGroup.name='Wheel_Config_Assembly_'+slot;
  wheelGroup.add(w);
  scene.add(wheelGroup);
  findWheels();
  if(wheelMeshes.length)wheelMeshes.forEach(o=>o.visible=false);
  activeWheel=slot;
  $('wheelStatus').textContent='Wheel '+slot+' active — '+wheelName[slot]+'. Matched to primary chair footprint, center and floor position. No manual wheel offset.';
  $('swap').textContent='SWAP WHEEL · '+(slot==='A'?'A → B':'B → A');
}
/* FINAL_WHEEL_ALIGNMENT_V7_END */
'''
          marker='</script>'
          i=s.rfind(marker)
          if i<0: raise SystemExit('Could not locate closing script tag')
          s=s[:i]+override+s[i:]
          p.write_text(s,encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Apply wheel alignment override v7"
          git push
