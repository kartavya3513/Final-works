name: Fix wheel transform

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Align wheel GLB to chair transform') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Align wheel to chair transform
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          pattern = r"function showWheel\(slot\)\{.*?\}function loadWheel\(slot,file\)\{"
          replacement = r'''function showWheel(slot){if(!model||!wheelGLB[slot])return;if(wheelGroup)scene.remove(wheelGroup);findWheels();wheelGroup=new T.Group();wheelGroup.name='Wheel_Config_Assembly_'+slot;const w=cloneWheel(wheelGLB[slot]);w.position.copy(model.position);w.quaternion.copy(model.quaternion);w.scale.copy(model.scale);wheelGroup.add(w);if(wheelMeshes.length)wheelMeshes.forEach(node=>node.visible=false);scene.add(wheelGroup);activeWheel=slot;$('wheelStatus').textContent='Wheel '+slot+' active — '+wheelName[slot]+'. Using the same position, rotation and scale transform as the chair GLB.';$('swap').textContent='SWAP WHEEL · '+(slot==='A'?'A → B':'B → A')}function loadWheel(slot,file){'''

          new, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not locate showWheel() in index.html')
          p.write_text(new, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Align wheel GLB to chair transform"
          git push
